<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 Calculateur Transfert DTF V2 — HCS Tahiti</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 1; }
    input:focus, textarea:focus { outline: none; }
    .results-section { animation: slideIn 0.4s ease-out; }
    @keyframes slideIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body class="bg-gray-900">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

/* ── Gammes produits HTV4U ─────────────────────────────────────── */
const PRODUCT_LINES = [
  {
    id: 'dtf',
    name: 'DTF Transfer Textile',
    emoji: '🎨',
    desc: 'Gang sheets 22" — HTV4U',
    rolls: [
      { id:'sheet', name:'22" Sheet',    w:55.88, h:55.88,
        tiers:[{min:1,max:5,p:5.99},{min:6,max:10,p:5.84},{min:11,max:19,p:5.69},{min:20,max:999,p:5.54}] },
      { id:'yd1',  name:'1 Yard Roll',  w:55.88, h:91.44,
        tiers:[{min:1,max:5,p:16.99},{min:6,max:10,p:16.57},{min:11,max:19,p:16.14},{min:20,max:999,p:15.72}] },
      { id:'yd2',  name:'2 Yards Roll', w:55.88, h:182.88,
        tiers:[{min:1,max:5,p:33.58},{min:6,max:10,p:32.74},{min:11,max:19,p:31.90},{min:20,max:999,p:31.06}] },
      { id:'yd3',  name:'3 Yards Roll', w:55.88, h:274.32,
        tiers:[{min:1,max:5,p:49.77},{min:6,max:10,p:48.53},{min:11,max:19,p:47.28},{min:20,max:999,p:46.04}] },
      { id:'yd5',  name:'5 Yards Roll', w:55.88, h:457.20,
        tiers:[{min:1,max:5,p:81.95},{min:6,max:10,p:79.90},{min:11,max:19,p:77.85},{min:20,max:999,p:75.80}] },
    ]
  },
  {
    id: 'uvdtf',
    name: 'UV DTF Custom Sticker',
    emoji: '⭐',
    desc: 'Stickers UV 22" — HTV4U',
    rolls: [
      { id:'uv6',  name:'22"×6"',  w:55.88, h:15.24,
        tiers:[{min:1,max:5,p:9.49},{min:6,max:10,p:9.25},{min:11,max:19,p:9.02},{min:20,max:999,p:8.78}] },
      { id:'uv12', name:'22"×12"', w:55.88, h:30.48,
        tiers:[{min:1,max:5,p:17.99},{min:6,max:10,p:17.54},{min:11,max:19,p:17.09},{min:20,max:999,p:16.64}] },
      { id:'uv1y', name:'22"×1YD', w:55.88, h:91.44,
        tiers:[{min:1,max:5,p:44.99},{min:6,max:10,p:43.87},{min:11,max:19,p:42.74},{min:20,max:999,p:41.62}] },
    ]
  }
];

const LS_KEY = 'hcs_calc_dtf_v2_params';

function CalculateurTransfertDTFV2() {
  const _p = (() => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } })();

  const [lineIdx,        setLineIdx]        = useState(_p.lineIdx        ?? 0);
  const [rollIdx,        setRollIdx]        = useState(_p.rollIdx        ?? 1);
  const [rollsOrdered,   setRollsOrdered]   = useState(_p.rollsOrdered   ?? 10);
  const [marginPercent,  setMarginPercent]  = useState(_p.marginPercent  ?? 300);
  const [dimensionsText, setDimensionsText] = useState(_p.dimensionsText ?? '10x15\n15x20\n5x10\n10x10\n24x24\n30x30');
  const [marginLogos,    setMarginLogos]    = useState(_p.marginLogos    ?? 1);
  const [quickH,         setQuickH]         = useState(_p.quickH         ?? 10);
  const [quickL,         setQuickL]         = useState(_p.quickL         ?? 15);
  const [usdXpf,         setUsdXpf]         = useState(_p.usdXpf         ?? 109.5);
  const [shippingUSD,    setShippingUSD]    = useState(_p.shippingUSD    ?? 66);
  const [dutyPct,        setDutyPct]        = useState(_p.dutyPct        ?? 7);
  const [tvaPct,         setTvaPct]         = useState(_p.tvaPct         ?? 16);
  const [brokerageUSD,   setBrokerageUSD]   = useState(_p.brokerageUSD   ?? 50);
  const [handlingUSD,    setHandlingUSD]    = useState(_p.handlingUSD    ?? 15);
  const [showResults,    setShowResults]    = useState(false);
  const resultsRef = useRef(null);

  const line = PRODUCT_LINES[lineIdx];
  const safeRollIdx = Math.min(rollIdx, line.rolls.length - 1);
  const roll = line.rolls[safeRollIdx];

  const getPriceForQty = (r, qty) => {
    const t = r.tiers.find(t => qty >= t.min && qty <= t.max);
    return t ? t.p : r.tiers[r.tiers.length - 1].p;
  };

  const getTierLabel = (qty) => {
    if (qty >= 20) return '(palier 20+)';
    if (qty >= 11) return '(palier 11-19)';
    if (qty >= 6)  return '(palier 6-10)';
    return '(palier 1-5)';
  };

  useEffect(() => {
    localStorage.setItem(LS_KEY, JSON.stringify({
      lineIdx, rollIdx: safeRollIdx, rollsOrdered, marginPercent, dimensionsText,
      marginLogos, quickH, quickL, usdXpf, shippingUSD, dutyPct, tvaPct, brokerageUSD, handlingUSD
    }));
  }, [lineIdx, safeRollIdx, rollsOrdered, marginPercent, dimensionsText,
      marginLogos, quickH, quickL, usdXpf, shippingUSD, dutyPct, tvaPct, brokerageUSD, handlingUSD]);

  const ROLL_W    = roll.w;
  const ROLL_H    = roll.h;
  const ROLL_AREA = ROLL_W * ROLL_H;
  const isAmber   = lineIdx === 0;

  const calc = useMemo(() => {
    const priceUSD = getPriceForQty(roll, rollsOrdered);
    const prodUSD  = priceUSD * rollsOrdered;
    const prodXPF  = Math.round(prodUSD * usdXpf);
    const portXPF  = Math.round(shippingUSD * usdXpf);
    const cif      = prodXPF + portXPF;
    const douane   = Math.round(cif * dutyPct / 100);
    const tva      = Math.round((cif + douane) * tvaPct / 100);
    const frais    = Math.round((brokerageUSD + handlingUSD) * usdXpf);
    const total    = cif + douane + tva + frais;
    const totalArea = ROLL_AREA * rollsOrdered;
    const cpcm2    = totalArea > 0 ? total / totalArea : 0;
    const cpc100   = Math.round(cpcm2 * 100);
    const cpy      = Math.round(total / rollsOrdered);

    const dims = dimensionsText.split('\n').map(l => {
      const [h, w] = l.trim().split('x').map(Number);
      return h > 0 && w > 0 ? { h, l: w, surface: h * w } : null;
    }).filter(Boolean);

    const designCosts = dims.map(d => {
      const lW   = Math.max(0, Math.floor(ROLL_W / (d.l + marginLogos)));
      const lH   = Math.max(0, Math.floor(ROLL_H / (d.h + marginLogos)));
      const cout = Math.max(1, Math.round(d.surface * cpcm2));
      const prix = Math.round(cout * (1 + marginPercent / 100));
      return { ...d, logosW: lW, logosH: lH, totalRoll: lW * lH, coutLogo: cout, prixVente: prix, margePct: marginPercent };
    });

    return { priceUSD, prodUSD, prodXPF, portXPF, cif, douane, tva, frais, total, totalArea, cpcm2, cpc100, cpy, designCosts };
  }, [lineIdx, safeRollIdx, rollsOrdered, marginPercent, dimensionsText, marginLogos,
      usdXpf, shippingUSD, dutyPct, tvaPct, brokerageUSD, handlingUSD, roll, ROLL_W, ROLL_H, ROLL_AREA]);

  const qCalc = useMemo(() => {
    if (!quickH || !quickL || !calc.cpcm2) return null;
    const lW   = Math.max(0, Math.floor(ROLL_W / (quickL + marginLogos)));
    const lH   = Math.max(0, Math.floor(ROLL_H / (quickH + marginLogos)));
    const cout = Math.max(1, Math.round(quickH * quickL * calc.cpcm2));
    const prix = Math.round(cout * (1 + marginPercent / 100));
    return { lW, lH, totalRoll: lW * lH, cout, prix };
  }, [quickH, quickL, marginLogos, calc.cpcm2, marginPercent, ROLL_W, ROLL_H]);

  const yardLogos = useMemo(() => {
    if (!qCalc || !qCalc.lW || !qCalc.lH || qCalc.lW * qCalc.lH > 200) return [];
    const logos = [];
    const sX = ROLL_W / qCalc.lW, sY = ROLL_H / qCalc.lH;
    for (let r = 0; r < qCalc.lH; r++) {
      for (let c = 0; c < qCalc.lW; c++) {
        logos.push({
          id: `${r}-${c}`,
          x: (c * sX + (sX - quickL) / 2) / ROLL_W * 100,
          y: (r * sY + (sY - quickH) / 2) / ROLL_H * 100,
          w: quickL / ROLL_W * 100,
          h: quickH / ROLL_H * 100,
          prix: qCalc.prix
        });
      }
    }
    return logos;
  }, [qCalc, quickH, quickL, ROLL_W, ROLL_H]);

  /* Sauvegarde MySQL auto */
  const lastSaved = useRef(null);
  useEffect(() => {
    if (!calc || !calc.cpcm2 || !calc.designCosts?.length) return;
    const dedupKey = Math.round(calc.cpcm2 * 1000) + '_' + calc.designCosts.length + '_' + line.id + '_' + roll.id;
    if (lastSaved.current === dedupKey) return;
    lastSaved.current = dedupKey;
    const donnees = {
      type: line.id,
      cout_par_cm2: Math.round(calc.cpcm2 * 1000) / 1000,
      cout_par_100cm2: calc.cpc100,
      cout_par_yard: calc.cpy,
      vinyle_nom: `${line.name} — ${roll.name}`,
      formats_detail: JSON.stringify(calc.designCosts.map(d => ({
        nom: `${d.l}x${d.h}cm`, largeur_cm: d.l, hauteur_cm: d.h,
        surface_cm2: d.surface, cout_unitaire_xpf: d.coutLogo, prix_vente_xpf: d.prixVente
      }))),
      date: new Date().toISOString().slice(0, 10)
    };
    if (typeof HCSApi !== 'undefined') {
      HCSApi.save('calculs', donnees).catch(() => {});
    }
  }, [calc, line, roll]);

  const fmt = n => Number(n).toLocaleString('fr-FR');

  const exportCSV = () => {
    const rows = [
      ['HCS CALCULATEUR TRANSFERT DTF V2'], [],
      ['Gamme', line.name], ['Format rouleau', roll.name],
      ['Dimensions rouleau', `${ROLL_W}cm x ${ROLL_H.toFixed(2)}cm`],
      ['Rouleaux commandés', rollsOrdered], ['Prix unitaire USD', calc.priceUSD.toFixed(2)],
      ['Marge %', marginPercent], ['Taux USD/XPF', usdXpf], [],
      ['COUT RENDU TAHITI'],
      ['Produits XPF', calc.prodXPF], ['Port XPF', calc.portXPF],
      ['CIF XPF', calc.cif], ['Douane XPF', calc.douane], ['TVA XPF', calc.tva],
      ['Frais XPF', calc.frais], ['TOTAL XPF', calc.total],
      ['Cout/rouleau XPF', calc.cpy], ['Cout/100cm2 XPF', calc.cpc100], [],
      ['TARIFS PAR DIMENSION'],
      ['Format', 'Surface cm2', 'Logos/L', 'Logos/H', 'Total/Rouleau', 'Cout/Logo F', 'Prix Vente F', 'Marge %'],
      ...calc.designCosts.map(d => [
        `${d.h}x${d.l}cm`, d.surface, d.logosW, d.logosH,
        d.totalRoll, d.coutLogo, d.prixVente, d.margePct + '%'
      ])
    ];
    const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = `HCS_DTF_V2_${line.id}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };

  const exportProductCreator = () => {
    const fields = ['emoji','nom','designation','ref','categorie','type','tailles','couleurs','prix','prixTTC','cout','tva','stock','stockMin','unite','paliers','description'];
    const rows = [fields.join(';')];
    calc.designCosts.forEach(d => {
      const nom  = `${line.id === 'uvdtf' ? 'Sticker UV' : 'Transfert DTF'} ${d.h}x${d.l}cm`;
      const ref  = `${line.id === 'uvdtf' ? 'UV' : 'DTF'}-${d.h}x${d.l}`;
      const pttc = Math.round(d.prixVente * (1 + tvaPct / 100));
      const desc = `${line.name} ${d.h}x${d.l}cm — Surface ${d.surface}cm2 — Cout: ${d.coutLogo} XPF — Marge: ${d.margePct}%`;
      rows.push(['✨', nom, nom, ref, line.name, 'service', '', '', d.prixVente, pttc, d.coutLogo, tvaPct, 0, 0, 'unite', '', desc]
        .map(v => `"${String(v).replace(/"/g,'""')}"`).join(';'));
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' }));
    a.download = `HCS_ProductCreator_${line.id}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };

  const accentBorder  = isAmber ? 'border-amber-700/50' : 'border-violet-700/50';
  const accentText    = isAmber ? 'text-amber-400'       : 'text-violet-400';
  const accentBtnOn   = isAmber ? 'bg-amber-600 border-amber-400' : 'bg-violet-600 border-violet-400';
  const accentTabOn   = isAmber ? 'bg-amber-600/30 border-amber-500 text-amber-300 shadow-amber-900/40' : 'bg-violet-600/30 border-violet-500 text-violet-300 shadow-violet-900/40';

  return (
    <div className="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white p-4">
    <div className="max-w-7xl mx-auto">

      {/* Header */}
      <div className="text-center mb-6">
        <h1 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-violet-400 mb-2">
          🎨 Calculateur Transfert DTF V2
        </h1>
        <p className="text-gray-400">HCS Tahiti — Coût de revient + tarification par format · Source HTV4U</p>
        <p className="text-xs text-gray-500 mt-1">Largeur rouleau 22" (55.88 cm) · Calcul temps réel · Douane PF incluse</p>
      </div>

      {/* Onglets gamme */}
      <div className="grid grid-cols-2 gap-3 mb-5">
        {PRODUCT_LINES.map((pl, i) => (
          <button key={pl.id}
            onClick={() => { setLineIdx(i); setRollIdx(0); }}
            className={`py-4 rounded-xl font-bold text-sm transition border-2 shadow-lg ${
              lineIdx === i ? accentTabOn : 'bg-gray-800/40 border-gray-700 text-gray-400 hover:border-gray-500'
            }`}>
            <div className="text-2xl mb-1">{pl.emoji}</div>
            <div>{pl.name}</div>
            <div className="text-xs font-normal opacity-60 mt-0.5">{pl.desc}</div>
          </button>
        ))}
      </div>

      {/* Formats de rouleau */}
      <div className={`bg-gray-800/60 rounded-xl p-5 mb-5 border ${accentBorder}`}>
        <h2 className={`text-base font-bold mb-4 ${accentText}`}>
          📏 FORMAT ROULEAU — TARIFS HTV4U (palier actif en surbrillance)
        </h2>
        <div className="overflow-x-auto">
        <div className="grid gap-3" style={{gridTemplateColumns:`repeat(${line.rolls.length},minmax(130px,1fr))`}}>
          {line.rolls.map((r, i) => {
            const activePx  = getPriceForQty(r, rollsOrdered);
            const activeXPF = Math.round(activePx * usdXpf);
            return (
              <div key={r.id}>
                <button onClick={() => setRollIdx(i)}
                  className={`w-full p-2.5 rounded-lg border-2 transition font-bold mb-2 text-xs ${
                    safeRollIdx === i ? accentBtnOn + ' text-white shadow-lg' : 'bg-gray-700 border-gray-600 text-gray-300 hover:border-gray-400'
                  }`}>
                  {r.name}
                </button>
                <div className="bg-gray-900/50 rounded-lg p-2 text-xs space-y-1">
                  <div className="text-gray-500">{Math.round(r.w)}×{r.h.toFixed(0)}cm</div>
                  <div className="text-gray-500">{Math.round(r.w * r.h).toLocaleString()} cm²</div>
                  {r.tiers.map((t, ti) => {
                    const isActive = rollsOrdered >= t.min && rollsOrdered <= t.max;
                    return (
                      <div key={ti} className={`flex justify-between ${isActive ? (isAmber ? 'text-amber-400 font-bold' : 'text-violet-400 font-bold') : 'text-gray-500'}`}>
                        <span>{t.min}{t.max === 999 ? '+' : `-${t.max}`}</span>
                        <span>${t.p} → {Math.round(t.p * usdXpf).toLocaleString()}F</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
        </div>
      </div>

      {/* Frais & Douane */}
      <div className="bg-gray-800/40 rounded-xl p-5 mb-5 border border-red-800/50">
        <h2 className="text-base font-bold text-red-400 mb-4">💰 FRAIS & DOUANE (TAHITI)</h2>
        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 text-xs">
          {[
            {label:'Taux USD/XPF', val:usdXpf,      set:setUsdXpf,       step:0.1},
            {label:'Port USPS $',  val:shippingUSD,  set:setShippingUSD,  step:1  },
            {label:'Douane %',     val:dutyPct,      set:setDutyPct,      step:0.1},
            {label:'TVA %',        val:tvaPct,       set:setTvaPct,       step:0.1},
            {label:'Courtage $',   val:brokerageUSD, set:setBrokerageUSD, step:5  },
            {label:'Manutention $',val:handlingUSD,  set:setHandlingUSD,  step:5  },
          ].map(({label,val,set,step}) => (
            <div key={label} className="bg-black/20 rounded p-2.5">
              <div className="text-gray-400 mb-1">{label}</div>
              <input type="number" value={val} step={step}
                onChange={e => set(Number(e.target.value))}
                className="w-full bg-gray-700 rounded px-2 py-1 text-white text-sm border border-gray-600 focus:outline-none"/>
            </div>
          ))}
          <div className="bg-black/20 rounded p-2.5 flex flex-col justify-center">
            <div className="text-gray-400 mb-1">Total rendu</div>
            <div className="text-lg font-bold text-teal-400">{calc.total.toLocaleString('fr-FR')}</div>
            <div className="text-xs text-gray-500">XPF · {rollsOrdered} rouleaux</div>
          </div>
        </div>
      </div>

      <div className="grid lg:grid-cols-2 gap-5 mb-5">
        {/* Commande */}
        <div className="bg-gray-800/40 rounded-xl p-5 border border-gray-700 space-y-4">
          <h2 className="text-base font-bold text-teal-400">📋 COMMANDE</h2>
          <div>
            <label className="text-xs text-gray-400 block mb-1">Rouleaux commandés ({roll.name})</label>
            <input type="number" value={rollsOrdered} min="1"
              onChange={e => setRollsOrdered(Math.max(1, +e.target.value))}
              className="w-full bg-gray-700 rounded px-3 py-2 text-white border border-teal-600 focus:outline-none"/>
            <div className={`text-xs mt-1 font-bold ${accentText}`}>
              Prix unitaire : ${calc.priceUSD.toFixed(2)} → {Math.round(calc.priceUSD * usdXpf).toLocaleString()} F/rouleau {getTierLabel(rollsOrdered)}
            </div>
          </div>
          <div>
            <label className="text-xs text-gray-400 block mb-1">Coefficient marge (%)</label>
            <input type="number" value={marginPercent} step="10"
              onChange={e => setMarginPercent(+e.target.value)}
              className="w-full bg-gray-700 rounded px-3 py-2 text-white border border-green-600 focus:outline-none"/>
            <div className="text-xs text-gray-500 mt-1">
              {marginPercent}% → prix = coût × {(1 + marginPercent/100).toFixed(2)}
            </div>
          </div>
          <div>
            <label className="text-xs text-gray-400 block mb-1">Marge entre logos (cm)</label>
            <input type="number" value={marginLogos} step="0.5" min="0"
              onChange={e => setMarginLogos(Math.max(0, +e.target.value))}
              className="w-full bg-gray-700 rounded px-3 py-2 text-white border border-violet-600 focus:outline-none"/>
          </div>
          {/* Résumé rouleau */}
          <div className={`bg-gray-900/50 rounded-lg p-3 text-xs border ${accentBorder}`}>
            <div className={`font-bold mb-2 ${accentText}`}>{line.emoji} {line.name} / {roll.name}</div>
            <div className="text-gray-300">Surface/rouleau : <span className="text-white font-bold">{fmt(Math.round(ROLL_AREA))} cm²</span></div>
            <div className="text-gray-300">Coût/rouleau : <span className={`font-bold ${accentText}`}>{fmt(calc.cpy)} F</span></div>
            <div className="text-gray-300">Coût/100cm² : <span className="text-violet-400 font-bold">{fmt(calc.cpc100)} F</span></div>
          </div>
        </div>

        {/* Calcul rapide H×L */}
        <div className="bg-gradient-to-r from-violet-800/30 to-purple-800/30 rounded-xl p-5 border border-violet-600/50">
          <h2 className="text-base font-bold text-violet-400 mb-4">⚡ CALCUL RAPIDE H×L</h2>
          <div className="grid grid-cols-2 gap-3 mb-4">
            <div>
              <label className="text-xs text-gray-400 block mb-1">Hauteur (cm)</label>
              <input type="number" value={quickH} min="1"
                onChange={e => setQuickH(Math.max(1, +e.target.value))}
                className="w-full bg-gray-700 rounded px-3 py-3 text-white text-lg border-2 border-violet-500 focus:outline-none"/>
            </div>
            <div>
              <label className="text-xs text-gray-400 block mb-1">Largeur (cm)</label>
              <input type="number" value={quickL} min="1"
                onChange={e => setQuickL(Math.max(1, +e.target.value))}
                className="w-full bg-gray-700 rounded px-3 py-3 text-white text-lg border-2 border-violet-500 focus:outline-none"/>
            </div>
          </div>
          {qCalc && (
            <div className="grid grid-cols-2 gap-3 text-center">
              <div className="bg-black/30 rounded-lg p-3">
                <div className="text-xs text-gray-400">Surface</div>
                <div className="text-xl font-bold text-violet-400">{quickH*quickL} cm²</div>
              </div>
              <div className="bg-black/30 rounded-lg p-3">
                <div className="text-xs text-gray-400">Logos/Rouleau</div>
                <div className="text-xl font-bold text-amber-400">{qCalc.lW}×{qCalc.lH}={qCalc.totalRoll}</div>
              </div>
              <div className="bg-black/30 rounded-lg p-3">
                <div className="text-xs text-gray-400">Coût matière</div>
                <div className="text-lg font-bold text-teal-400">{qCalc.cout.toLocaleString('fr-FR')} F</div>
              </div>
              <div className="bg-black/30 rounded-lg p-3">
                <div className="text-xs text-gray-400">Prix vente</div>
                <div className="text-lg font-bold text-green-400">{qCalc.prix.toLocaleString('fr-FR')} F</div>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Visualisation rouleau */}
      {yardLogos.length > 0 && (
        <div className="bg-gray-800/40 rounded-xl p-5 mb-5 border border-gray-700">
          <h2 className="text-base font-bold text-amber-400 mb-3">
            📐 RÉPARTITION — {quickH}×{quickL}cm · {qCalc?.totalRoll} logos · {roll.name}
          </h2>
          <div className="flex justify-center">
            <div style={{
              position:'relative', width:'100%', maxWidth:'260px',
              aspectRatio:`${ROLL_W}/${ROLL_H}`,
              background:'linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#1a1a2e 100%)',
              border:'3px solid #4ade80', borderRadius:'4px', overflow:'hidden'
            }}>
              {yardLogos.map(l => (
                <div key={l.id} style={{
                  position:'absolute', left:`${l.x}%`, top:`${l.y}%`,
                  width:`${l.w}%`, height:`${l.h}%`,
                  background:'linear-gradient(135deg,#3b82f6,#1e40af)',
                  border:'1px solid #60a5fa', borderRadius:'2px',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  fontSize:'0.45rem', color:'white', fontWeight:'bold'
                }}>
                  {quickH}×{quickL}
                </div>
              ))}
            </div>
          </div>
          <p className="text-xs text-gray-500 text-center mt-2">
            {ROLL_W}cm × {ROLL_H.toFixed(0)}cm · Marge {marginLogos}cm
          </p>
        </div>
      )}

      {/* Dimensions à calculer */}
      <div className="bg-gray-800/40 rounded-xl p-5 mb-5 border border-gray-700">
        <h2 className="text-base font-bold text-violet-400 mb-3">📋 DIMENSIONS À CALCULER (HxL)</h2>
        <div className="grid lg:grid-cols-3 gap-4">
          <div className="lg:col-span-2">
            <label className="text-xs text-gray-400 block mb-2">Une dimension par ligne (ex: 10x15)</label>
            <textarea value={dimensionsText}
              onChange={e => setDimensionsText(e.target.value)}
              className="w-full h-28 bg-gray-700 rounded px-3 py-2 text-white text-sm border border-violet-600 font-mono focus:outline-none focus:border-violet-400"
              placeholder="10x15&#10;15x20&#10;5x10"/>
          </div>
          <div className="bg-gray-900/50 rounded-lg p-3 text-xs space-y-2 self-start">
            <p className={`font-bold ${accentText}`}>Coûts unitaires :</p>
            <p className="text-gray-300">Coût/rouleau : <span className={`font-bold ${accentText}`}>{fmt(calc.cpy)} F</span></p>
            <p className="text-gray-300">Coût/100cm² : <span className="text-violet-400 font-bold">{fmt(calc.cpc100)} F</span></p>
            <p className="text-gray-300">Surface/rouleau : <span className="text-gray-400">{fmt(Math.round(ROLL_AREA))} cm²</span></p>
            <p className="text-gray-400">{roll.name} · {ROLL_W}×{ROLL_H.toFixed(0)}cm</p>
            <p className="text-gray-400">{dimensionsText.split('\n').filter(l=>l.trim()&&l.includes('x')).length} format(s) à calculer</p>
          </div>
        </div>
      </div>

      {/* Boutons action */}
      <div className="grid md:grid-cols-3 gap-4 mb-6">
        <button onClick={() => { setShowResults(true); setTimeout(()=>resultsRef.current?.scrollIntoView({behavior:'smooth'}),100); }}
          className="bg-gradient-to-r from-green-600 to-green-500 hover:brightness-110 px-6 py-4 rounded-xl text-base font-bold transition shadow-xl">
          🧮 CALCULER & AFFICHER
        </button>
        <button onClick={exportCSV}
          className="bg-gradient-to-r from-blue-600 to-blue-500 hover:brightness-110 px-6 py-4 rounded-xl text-base font-bold transition shadow-xl">
          📥 EXPORTER CSV
        </button>
        <button onClick={exportProductCreator}
          className="bg-gradient-to-r from-teal-600 to-cyan-500 hover:brightness-110 px-6 py-4 rounded-xl text-base font-bold transition shadow-xl">
          📦 PRODUCT CREATOR CSV
        </button>
      </div>

      {/* Résultats */}
      {showResults && (
        <div className="results-section space-y-5" ref={resultsRef}>

          {/* KPIs */}
          <div className="grid md:grid-cols-3 gap-4">
            {[
              {label:'TOTAL RENDU TAHITI',             val:`${fmt(calc.total)} F`,   color:'text-teal-400'},
              {label:`COÛT / ${roll.name.toUpperCase()}`, val:`${fmt(calc.cpy)} F`,  color:accentText},
              {label:'COÛT / 100 cm²',                 val:`${fmt(calc.cpc100)} F`, color:'text-violet-400'},
            ].map(k => (
              <div key={k.label} className="bg-gray-800/50 rounded-xl p-5 border border-gray-700 text-center">
                <div className="text-xs text-gray-400 mb-2">{k.label}</div>
                <div className={`text-3xl font-bold ${k.color}`}>{k.val}</div>
              </div>
            ))}
          </div>

          {/* Détail coûts */}
          <div className="bg-gradient-to-r from-teal-800/30 to-amber-800/30 rounded-xl p-5 border border-teal-600/40">
            <h2 className="text-base font-bold text-teal-400 mb-4">💰 COÛT RENDU TAHITI — DÉTAIL</h2>
            <div className="text-sm space-y-2">
              {[
                {lbl:'① Produits',          val:fmt(calc.prodXPF), cls:''},
                {lbl:'② Port USPS',         val:fmt(calc.portXPF), cls:'text-blue-400'},
                {lbl:'= CIF',               val:fmt(calc.cif),     cls:'text-teal-400 font-bold', bg:'bg-gray-900/30'},
                {lbl:`③ Douane (${dutyPct}%)`, val:fmt(calc.douane), cls:'text-red-400'},
                {lbl:`④ TVA (${tvaPct}%)`,  val:fmt(calc.tva),     cls:'text-red-400'},
                {lbl:'⑤ Frais',             val:fmt(calc.frais),   cls:'text-gray-400'},
              ].map(r => (
                <div key={r.lbl} className={`flex justify-between py-2 border-b border-gray-700/50 px-2 rounded ${r.bg||''}`}>
                  <span className="text-gray-400">{r.lbl}</span>
                  <span className={`font-bold ${r.cls}`}>{r.val} F</span>
                </div>
              ))}
              <div className="flex justify-between py-3 text-lg font-bold bg-teal-900/30 px-2 rounded">
                <span>= TOTAL RENDU TAHITI</span>
                <span className="text-teal-400">{fmt(calc.total)} F</span>
              </div>
            </div>
          </div>

          {/* Tableau formats */}
          {calc.designCosts.length > 0 && (
            <div className="bg-gray-800/50 rounded-xl p-5 border border-gray-700">
              <h2 className="text-base font-bold text-green-400 mb-4">
                🏷️ TARIFS PAR DIMENSION — {line.name} / {roll.name}
              </h2>
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead><tr className="border-b border-gray-700">
                    {['Format','Surface','Logos/L','Logos/H','Total/Rouleau','Coût/Logo','Marge','Prix Vente'].map(h => (
                      <th key={h} className={`py-2 text-gray-400 ${h==='Format'?'text-left':'text-right'}`}>{h}</th>
                    ))}
                  </tr></thead>
                  <tbody>
                    {calc.designCosts.map((d,i) => (
                      <tr key={i} className="border-b border-gray-700/40 hover:bg-gray-900/30">
                        <td className="py-2">{d.h} × {d.l} cm</td>
                        <td className="text-right">{d.surface} cm²</td>
                        <td className="text-right font-bold text-amber-400">{d.logosW}</td>
                        <td className="text-right font-bold text-amber-400">{d.logosH}</td>
                        <td className="text-right font-bold text-green-400">{d.totalRoll}</td>
                        <td className="text-right text-gray-300">{fmt(d.coutLogo)} F</td>
                        <td className="text-right text-violet-400">{d.margePct}%</td>
                        <td className="text-right font-bold text-green-400 text-sm">{fmt(d.prixVente)} F</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          <div className="bg-gray-800/30 rounded-lg p-4 text-xs text-gray-500 space-y-1">
            <p>* Source : HTV4U Bulk Pricing — {line.name}</p>
            <p>* Rouleau : {roll.name} · {ROLL_W}cm × {ROLL_H.toFixed(0)}cm = {fmt(Math.round(ROLL_AREA))} cm²</p>
            <p>* Coût/logo = Surface × (coût total ÷ surface totale commandée)</p>
            <p>* Prix vente = Coût × (1 + {marginPercent}%) = Coût × {(1+marginPercent/100).toFixed(2)}</p>
            <p>* Douane PF : méthode CIF · Droits {dutyPct}% + TVA {tvaPct}% + frais courtier</p>
          </div>
        </div>
      )}

    </div>
    </div>
  );
}

ReactDOM.render(<CalculateurTransfertDTFV2 />, document.getElementById('root'));
</script>
</body>
</html>
