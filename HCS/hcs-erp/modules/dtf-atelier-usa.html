<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTF Atelier USA — HCS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--white:#f5f0e8;--gold:#d4a843;--grey:#2a2a2a;--grey-lt:#888}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:var(--grey);border:1px solid rgba(212,168,67,.2);border-radius:16px;padding:48px 56px;text-align:center;max-width:480px}
.icon{font-size:56px;margin-bottom:20px}
h1{font-size:1.5rem;font-weight:700;color:var(--gold);margin-bottom:10px}
p{color:var(--grey-lt);font-size:.95rem;line-height:1.6;margin-bottom:20px}
.badge{display:inline-block;background:rgba(212,168,67,.12);color:var(--gold);border:1px solid rgba(212,168,67,.3);border-radius:20px;padding:4px 14px;font-size:.8rem;font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🖨️</div>
  <h1>DTF Atelier USA</h1>
  <p>Ce module de suivi des transferts DTF importés des États-Unis (HTV4U) est en cours de développement.</p>
  <span class="badge">À venir — Module DTF USA</span>
</div>
</body>
</html>
