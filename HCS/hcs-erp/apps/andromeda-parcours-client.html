<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f1a;--bg-card:#16162a;--bg-card2:#1e1e35;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --text:rgba(255,255,255,.92);--text2:rgba(255,255,255,.55);--text3:rgba(255,255,255,.28);
  --radius:12px;--radius-sm:8px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

/* ── Header ── */
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:1px solid var(--border2);padding:16px 24px;display:flex;align-items:center;gap:14px}
.header-logo{width:36px;height:36px;background:linear-gradient(135deg,#6c63ff,#a78bfa);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.header-title{font-size:1rem;font-weight:800;letter-spacing:.5px}
.header-sub{font-size:.7rem;color:var(--text3);margin-top:2px}
.header-badge{margin-left:auto;padding:5px 12px;background:rgba(108,99,255,.15);border:1px solid rgba(108,99,255,.3);border-radius:20px;font-size:.68rem;font-weight:700;color:#a78bfa}

/* ── Layout ── */
.layout{display:flex;min-height:calc(100vh - 69px)}

/* ── Sidebar ── */
.sidebar{width:220px;flex-shrink:0;background:var(--bg-card);border-right:1px solid var(--border);padding:16px 0;position:sticky;top:0;height:calc(100vh - 69px);overflow-y:auto}
.sidebar-section{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);padding:0 16px 8px;margin-top:16px}
.sidebar-section:first-child{margin-top:0}
.camp-btn{width:100%;padding:11px 16px;background:none;border:none;color:var(--text2);font-size:.78rem;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:all .15s;border-left:3px solid transparent}
.camp-btn:hover{background:rgba(255,255,255,.04);color:var(--text)}
.camp-btn.active{background:rgba(108,99,255,.1);color:white;border-left-color:var(--camp-color)}
.camp-btn .camp-emoji{font-size:1.1rem;width:24px;text-align:center;flex-shrink:0}
.camp-btn .camp-name{font-weight:600;line-height:1.2}
.camp-btn .camp-id{font-size:.6rem;color:var(--text3);margin-top:1px}

/* ── Main ── */
.main{flex:1;padding:24px;overflow-x:hidden}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.section-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.tag-b{background:rgba(108,99,255,.12);border:1px solid rgba(108,99,255,.25);color:#a78bfa}
.tag-a{background:rgba(67,233,123,.08);border:1px solid rgba(67,233,123,.2);color:#43e97b}
.section-label{font-size:.68rem;color:var(--text3)}

/* ── Camp header ── */
.camp-header{background:linear-gradient(135deg,var(--camp-color-dark,#1a1a2e),var(--bg-card2));border:1px solid var(--border2);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px}
.camp-header-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0}
.camp-header-name{font-size:1.05rem;font-weight:800}
.camp-header-desc{font-size:.73rem;color:var(--text2);margin-top:3px}
.camp-header-meta{margin-left:auto;text-align:right}
.camp-header-price{font-size:.95rem;font-weight:900}
.camp-header-steps-count{font-size:.65rem;color:var(--text3);margin-top:2px}

/* ── Option B — Flow opérateur ── */
.flow-wrap{margin-bottom:28px}
.flow-grid{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding-bottom:8px}
.flow-step{flex:1;min-width:140px;max-width:200px;position:relative}
.flow-step:not(:last-child)::after{content:'';position:absolute;top:34px;right:-16px;width:32px;height:2px;background:linear-gradient(90deg,var(--camp-color,#6c63ff),transparent 70%);z-index:1}
.flow-card{background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:0 8px;transition:all .2s;cursor:pointer;height:100%}
.flow-card:hover{border-color:var(--camp-color,#6c63ff);transform:translateY(-2px)}
.flow-card.active-step{border-color:var(--camp-color,#6c63ff);background:rgba(108,99,255,.08)}
.flow-num{width:26px;height:26px;border-radius:50%;background:var(--camp-color,#6c63ff);color:#fff;font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.flow-icon{font-size:1.4rem;margin-bottom:6px}
.flow-name{font-size:.8rem;font-weight:800;margin-bottom:4px}
.flow-desc{font-size:.65rem;color:var(--text2);line-height:1.4;margin-bottom:8px}
.flow-time{font-size:.6rem;color:var(--text3);display:flex;align-items:center;gap:4px}
.flow-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.flow-tag{padding:2px 6px;border-radius:4px;font-size:.56rem;font-weight:700}
.flow-tag.required{background:rgba(255,90,90,.1);border:1px solid rgba(255,90,90,.25);color:#ff6b6b}
.flow-tag.optional{background:rgba(255,200,60,.07);border:1px solid rgba(255,200,60,.2);color:#ffd23f}
.flow-tag.auto{background:rgba(67,233,123,.07);border:1px solid rgba(67,233,123,.2);color:#43e97b}
.flow-tag.krypton{background:rgba(108,99,255,.1);border:1px solid rgba(108,99,255,.25);color:#a78bfa}

/* Métriques conversion */
.metrics-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.metric-card{flex:1;min-width:110px;background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.metric-val{font-size:1.2rem;font-weight:900}
.metric-label{font-size:.62rem;color:var(--text3);margin-top:2px}
.metric-trend{font-size:.62rem;margin-top:4px}
.metric-trend.up{color:#43e97b}
.metric-trend.neutral{color:#ffd23f}

/* Funnnel bar */
.funnel-wrap{background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px}
.funnel-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:10px}
.funnel-step{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.funnel-label{font-size:.72rem;width:130px;flex-shrink:0;font-weight:600}
.funnel-bar-wrap{flex:1;height:18px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.funnel-bar{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:.58rem;font-weight:800;color:rgba(255,255,255,.7);transition:width .6s ease}
.funnel-pct{font-size:.65rem;color:var(--text2);width:38px;text-align:right;flex-shrink:0}

/* ── Option A — Preview modal client ── */
.preview-modal{background:linear-gradient(160deg,#1a1a2e,#12122a);border:1px solid var(--border2);border-radius:16px;padding:20px;max-width:420px;position:relative;overflow:hidden}
.preview-modal::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:var(--camp-color,#6c63ff);opacity:.06;border-radius:50%}
.preview-modal-title{font-size:.8rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* Step bar client */
.client-step-bar{display:flex;align-items:center;margin-bottom:16px}
.cs-item{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px}
.cs-dot{width:28px;height:28px;border-radius:50%;font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--border2)}
.cs-dot.done{background:var(--camp-color,#6c63ff);border-color:var(--camp-color,#6c63ff);color:#fff}
.cs-dot.active{background:rgba(108,99,255,.15);border-color:var(--camp-color,#6c63ff);color:var(--camp-color,#6c63ff)}
.cs-dot.idle{background:rgba(255,255,255,.04);border-color:var(--border);color:var(--text3)}
.cs-lbl{font-size:.58rem;color:var(--text3);text-align:center;max-width:60px}
.cs-lbl.active{color:var(--text)}
.cs-conn{flex:1;height:2px;background:var(--border);border-radius:1px;max-width:28px;margin-bottom:16px}
.cs-conn.done{background:var(--camp-color,#6c63ff)}

/* Step illustrations row */
.client-steps-illus{display:flex;gap:8px;margin-top:4px}
.cs-illus{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center}
.cs-illus-icon{font-size:1.2rem;margin-bottom:4px}
.cs-illus-name{font-size:.6rem;font-weight:700;color:var(--text);margin-bottom:2px}
.cs-illus-detail{font-size:.55rem;color:var(--text3);line-height:1.3}
.cs-illus.active-illus{background:rgba(108,99,255,.08);border-color:var(--camp-color,rgba(108,99,255,.4))}

/* Config panel */
.config-panel{background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px}
.config-panel-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:10px}
.config-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.config-row:last-child{border-bottom:none}
.config-key{font-size:.72rem;color:var(--text2);flex:1}
.config-val{font-size:.7rem;font-weight:700;color:var(--text)}
.config-status{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.55rem;flex-shrink:0}
.config-status.ok{background:rgba(67,233,123,.15);color:#43e97b}
.config-status.warn{background:rgba(255,200,60,.12);color:#ffd23f}
.config-status.na{background:rgba(255,255,255,.06);color:var(--text3)}

/* Tips */
.tip-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.tip{background:rgba(108,99,255,.06);border:1px solid rgba(108,99,255,.15);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.tip-icon{font-size:.9rem;flex-shrink:0;margin-top:1px}
.tip-text{font-size:.7rem;color:var(--text2);line-height:1.4}
.tip-text strong{color:var(--text);font-weight:700}

/* divider */
.divider{border:none;border-top:1px solid var(--border);margin:22px 0}

/* responsive */
@media(max-width:700px){
  .sidebar{width:52px}
  .camp-btn .camp-name,.camp-btn .camp-id{display:none}
  .camp-btn{justify-content:center;padding:12px 0;border-left:none;border-bottom:3px solid transparent}
  .camp-btn.active{border-bottom-color:var(--camp-color);border-left:none}
  .flow-grid{flex-direction:column}
  .flow-step::after{display:none}
}

const TAG_CONFIG = { required:'Obligatoire', optional:'Optionnel', auto:'Automatique', krypton:'Krypton SDK' };
const TAG_CLASSES = { required:'required', optional:'optional', auto:'auto', krypton:'krypton' };

let currentStep = 1;

function colorCss(campData) {
  return `--camp-color:${campData.color};--camp-color-dark:${campData.colorDark}`;
}

function renderFunnelBar(pct, color) {
  return `<div class="funnel-bar" style="width:${pct}%;background:linear-gradient(90deg,${color},${color}88)">${pct}%</div>`;
}

function showCamp(id) {
  // Update sidebar active state
  document.querySelectorAll('.camp-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-'+id);
  if (btn) btn.classList.add('active');
  currentStep = 1;
  renderCamp(id);
}

function setActiveStep(campId, stepNum) {
  currentStep = stepNum;
  renderCamp(campId);
}

function renderCamp(id) {
  const d = CAMPS_DATA[id];
  if (!d) return;
  const main = document.getElementById('main-area');

  // ── URLs publiées depuis Andromeda
  const _pubUrls = JSON.parse(localStorage.getItem('hcs_published_urls') || '{}');
  const _lpUrl   = _pubUrls[id] || null;

  // ── Accès rapide LP
  const _quickAccess = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${_lpUrl
        ? `<a href="${_lpUrl}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:${d.color};color:#fff;border-radius:8px;font-size:.75rem;font-weight:700;text-decoration:none">🌐 Ouvrir la LP ↗</a>`
        : `<span style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.35);border-radius:8px;font-size:.75rem;border:1px dashed rgba(255,255,255,.15)">🌐 LP non publiée — exporter depuis Andromeda</span>`
      }
      <a href="../apps/andromeda-campaign.html" style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.8);border-radius:8px;font-size:.75rem;text-decoration:none;border:1px solid rgba(255,255,255,.1)">📣 Andromeda</a>
    </div>`;

  // Camp header
  const campHeader = `
    <div class="camp-header" style="${colorCss(d)}">
      <div class="camp-header-icon" style="background:${d.colorDark};border:1px solid rgba(255,255,255,.1)">${d.emoji}</div>
      <div>
        <div class="camp-header-name">${d.name}</div>
        <div class="camp-header-desc">${d.desc}</div>
      </div>
      <div class="camp-header-meta">
        <div class="camp-header-price" style="color:${d.color}">${d.priceRange}</div>
        <div class="camp-header-steps-count">${d.steps.length} étapes tunnel</div>
      </div>
    </div>`;

  // ── OPTION B — Flow opérateur
  const flowCards = d.steps.map((s, i) => {
    const isActive = currentStep === s.num;
    const tagsList = s.required.map((t, ti) =>
      `<span class="flow-tag ${TAG_CLASSES[s.tags[ti]] || 'required'}">${TAG_CONFIG[s.tags[ti]] || s.tags[ti]} · ${t}</span>`
    ).concat(
      (s.optional || []).map((t, ti) =>
        `<span class="flow-tag ${TAG_CLASSES[s.tags[s.required.length + ti]] || 'optional'}">${TAG_CONFIG[s.tags[s.required.length + ti]] || 'Optionnel'} · ${t}</span>`
      )
    ).join('');
    return `
      <div class="flow-step" style="${colorCss(d)}">
        <div class="flow-card${isActive ? ' active-step' : ''}" onclick="setActiveStep(${id},${s.num})" style="${colorCss(d)}">
          <div class="flow-num" style="background:${d.color}">${s.num}</div>
          <div class="flow-icon">${s.icon}</div>
          <div class="flow-name">${s.name}</div>
          <div class="flow-desc">${s.desc}</div>
          <div class="flow-time">⏱ ${s.time}</div>
          <div class="flow-tags">${tagsList}</div>
        </div>
      </div>`;
  }).join('');

  // ── Métriques
  const totalSteps = d.steps.length;
  const convFinal = d.steps[totalSteps-1].funnel;
  const avgTime = d.steps.reduce((a, s) => {
    const n = parseFloat(s.time.replace('~','')) || 0;
    return a + (s.time.includes('min') ? Math.round(n * 60) : n);
  }, 0);
  const metricsHTML = `
    <div class="metrics-row">
      <div class="metric-card">
        <div class="metric-val" style="color:${d.color}">${totalSteps}</div>
        <div class="metric-label">Étapes tunnel</div>
        <div class="metric-trend neutral">standard</div>
      </div>
      <div class="metric-card">
        <div class="metric-val" style="color:${d.color}">${convFinal}%</div>
        <div class="metric-label">Conv. estimée</div>
        <div class="metric-trend up">↑ cible &gt; 50%</div>
      </div>
      <div class="metric-card">
        <div class="metric-val" style="color:${d.color}">${avgTime >= 60 ? Math.floor(avgTime/60)+'min'+(avgTime%60?(' '+avgTime%60+'s'):'') : avgTime+'s'}</div>
        <div class="metric-label">Durée estimée</div>
        <div class="metric-trend neutral">temps client</div>
      </div>
      <div class="metric-card">
        <div class="metric-val" style="color:${d.color}">XPF</div>
        <div class="metric-label">Devise paiement</div>
        <div class="metric-trend up">OSB Krypton</div>
      </div>
    </div>`;

  // ── Funnel
  const funnelRows = d.steps.map(s => `
    <div class="funnel-step">
      <div class="funnel-label">${s.icon} ${s.name}</div>
      <div class="funnel-bar-wrap">${renderFunnelBar(s.funnel, d.color)}</div>
      <div class="funnel-pct">${s.funnel}%</div>
    </div>`).join('');

  // ── Config (LP row activée dynamiquement si URL publiée)
  const configRows = d.config.map(c => {
    let val = c.val, status = c.ok ? 'ok' : c.warn ? 'warn' : 'na', icon = c.ok ? '✓' : c.warn ? '!' : '—';
    if (c.warn && _lpUrl) {
      val = `<a href="${_lpUrl}" target="_blank" rel="noopener" style="color:#43e97b;text-decoration:none;font-weight:600">${_lpUrl.length > 32 ? _lpUrl.slice(0,32)+'…' : _lpUrl} ↗</a>`;
      status = 'ok'; icon = '✓';
    }
    return `<div class="config-row">
      <div class="config-key">${c.key}</div>
      <div class="config-val">${val}</div>
      <div class="config-status ${status}">${icon}</div>
    </div>`;
  }).join('');

  // ── Tips
  const tipsHTML = d.tips.map(t => `
    <div class="tip">
      <div class="tip-icon">${t.icon}</div>
      <div class="tip-text">${t.text}</div>
    </div>`).join('');

  // ── OPTION A — Preview modal client
  const stepBar = d.steps.map((s, i) => {
    const n = i + 1;
    const dotClass = n < currentStep ? 'done' : n === currentStep ? 'active' : 'idle';
    const lblClass = n === currentStep ? 'active' : '';
    const conn = i < d.steps.length - 1 ? `<div class="cs-conn${n < currentStep ? ' done' : ''}"></div>` : '';
    return `<div class="cs-item">
      <div class="cs-dot ${dotClass}" style="${dotClass==='done'?'background:'+d.color+';border-color:'+d.color:dotClass==='active'?'border-color:'+d.color+';color:'+d.color:''}">${n < currentStep ? '✓' : n}</div>
      <div class="cs-lbl ${lblClass}">${s.label}</div>
    </div>${conn}`;
  }).join('');

  const illusCards = d.steps.map((s, i) => {
    const n = i + 1;
    const isActiveIllus = n === currentStep;
    return `<div class="cs-illus${isActiveIllus ? ' active-illus' : ''}" style="${isActiveIllus ? '--camp-color:'+d.color+';' : ''}cursor:pointer" onclick="setActiveStep(${id},${n})">
      <div class="cs-illus-icon">${s.icon}</div>
      <div class="cs-illus-name">${s.name}</div>
      <div class="cs-illus-detail">${s.required.slice(0,2).join(' · ')}</div>
    </div>`;
  }).join('');

  const activeStepData = d.steps.find(s => s.num === currentStep) || d.steps[0];

  main.innerHTML = campHeader + _quickAccess + `

    <!-- ── OPTION B ── -->
    <div class="section-head" style="margin-bottom:14px">
      <span class="section-tag tag-b">B · Vue opérateur</span>
      <span class="section-label">Tunnel configurateur — cliquez une étape pour la détailler</span>
    </div>

    <div class="flow-wrap" style="${colorCss(d)}">
      <div class="flow-grid">${flowCards}</div>
    </div>

    ${metricsHTML}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <div>
        <div class="funnel-wrap">
          <div class="funnel-title">📉 Taux de conversion estimé par étape</div>
          ${funnelRows}
        </div>
      </div>
      <div>
        <div class="config-panel">
          <div class="config-panel-title">⚙️ Configuration requise</div>
          ${configRows}
        </div>
      </div>
    </div>

    <div class="tip-list">${tipsHTML}</div>

    <hr class="divider">

    <!-- ── OPTION A ── -->
    <div class="section-head" style="margin-bottom:14px">
      <span class="section-tag tag-a">A · Vue client</span>
      <span class="section-label">Aperçu de la barre de progression dans le modal Andromeda</span>
    </div>

    <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">
      <div class="preview-modal" style="${colorCss(d)}">
        <div class="preview-modal-title">
          <span style="font-size:1.1rem">${d.emoji}</span>
          ${d.name}
          <span style="margin-left:auto;font-size:.6rem;color:var(--text3);background:rgba(255,255,255,.05);padding:3px 7px;border-radius:10px">modal client</span>
        </div>
        <div class="client-step-bar">${stepBar}</div>
        <div style="font-size:.72rem;color:var(--text2);margin-bottom:10px;padding:8px 10px;background:rgba(255,255,255,.04);border-radius:8px">
          <strong style="color:${d.color}">${activeStepData.icon} Étape ${currentStep} — ${activeStepData.name}</strong><br>
          <span style="font-size:.65rem">${activeStepData.desc}</span>
        </div>
        <div class="client-steps-illus">${illusCards}</div>
        <div style="margin-top:10px;display:flex;justify-content:space-between">
          ${currentStep > 1 ? `<button onclick="setActiveStep(${id},${currentStep-1})" style="padding:7px 14px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text2);font-size:.72rem;cursor:pointer">← Retour</button>` : '<span></span>'}
          ${currentStep < d.steps.length ? `<button onclick="setActiveStep(${id},${currentStep+1})" style="padding:7px 14px;border-radius:7px;background:${d.color};border:none;color:#fff;font-size:.72rem;font-weight:800;cursor:pointer">${currentStep === d.steps.length-1 ? '💳 Payer' : 'Suivant →'}</button>` : `<button style="padding:7px 14px;border-radius:7px;background:linear-gradient(135deg,#43e97b,#38f9d7);border:none;color:#0f0f1a;font-size:.72rem;font-weight:800">✅ Commande validée</button>`}
        </div>
      </div>

      <div style="flex:1;min-width:220px">
        <div style="font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:8px">Étape active : ${activeStepData.icon} ${activeStepData.name}</div>
        ${activeStepData.required.map((r,i) => `
          <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px">
            <span style="color:${d.color};font-size:.8rem">◆</span>
            <span style="font-size:.72rem"><strong>${r}</strong></span>
            <span class="flow-tag required" style="margin-left:auto">Requis</span>
          </div>`).join('')}
        ${(activeStepData.optional||[]).map(r => `
          <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px">
            <span style="color:var(--text3);font-size:.8rem">◇</span>
            <span style="font-size:.72rem;color:var(--text2)">${r}</span>
            <span class="flow-tag optional" style="margin-left:auto">Optionnel</span>
          </div>`).join('')}
        <div style="margin-top:10px;padding:8px 10px;background:rgba(255,255,255,.03);border-radius:8px;font-size:.65rem;color:var(--text3)">
          ⏱ Durée estimée étape : <strong style="color:var(--text2)">${activeStepData.time}</strong>
        </div>
      </div>
    </div>
  `;
}

// Init
let _currentCampId = 0;
const _origShowCamp = showCamp;
function showCamp(id) { _currentCampId = id; _origShowCamp(id); }

renderCamp(0);

// Mise à jour automatique si une LP est publiée dans un autre onglet
window.addEventListener('storage', e => {
  if (e.key === 'hcs_published_urls') renderCamp(_currentCampId);
});
</script>
</body>
</html>
