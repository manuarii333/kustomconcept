<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fenua Livraison — Tahiti</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050f08;--card:#091a0e;--card2:#0d2415;--border:#1a4a28;
  --teal:#16a34a;--teal2:#4ade80;--coral:#f97316;
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;
  --text:#e2f5ea;--dim:#4d7a5a;--dim2:#86b89a;
  --sidebar:220px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;font-size:14px}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}

/* SIDEBAR */
#sidebar{width:var(--sidebar);min-height:100vh;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100}
.logo{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.logo-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--teal2);letter-spacing:1px}
.logo-sub{font-size:10px;color:var(--dim2);margin-top:2px;letter-spacing:2px;text-transform:uppercase}
.nav{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;color:var(--dim2);transition:.2s;font-size:13px;border-left:3px solid transparent}
.nav-item:hover{color:var(--text);background:rgba(22,163,74,.10)}
.nav-item.active{color:var(--teal2);background:rgba(22,163,74,.15);border-left-color:var(--teal)}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.nav-sep{margin:8px 16px;border-top:1px solid var(--border)}
.sidebar-bottom{padding:16px;border-top:1px solid var(--border)}
.sidebar-date{font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace}

/* MAIN */
#main{margin-left:var(--sidebar);flex:1;min-height:100vh;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700}
.topbar-actions{display:flex;gap:8px;align-items:center}
.content{padding:24px}
.page{display:none}
.page.active{display:block}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.teal::before{background:var(--teal)}
.stat-card.green::before{background:var(--green)}
.stat-card.amber::before{background:var(--amber)}
.stat-card.coral::before{background:var(--coral)}
.stat-label{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.stat-value{font-size:26px;font-weight:700;font-family:'Syne',sans-serif}
.stat-sub{font-size:11px;color:var(--dim2);margin-top:4px}
.stat-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.15}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;border:none;font-size:13px;font-weight:500;transition:.2s}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:#15803d}
.btn-outline{background:transparent;color:var(--dim2);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--teal);color:var(--teal)}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{background:transparent;border:1px solid var(--border);color:var(--dim2);padding:5px 8px;border-radius:5px;font-size:13px}
.btn-icon:hover{border-color:var(--teal);color:var(--teal)}

/* TABLES */
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{background:var(--card2);padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--dim2);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:middle;font-size:13px}
tr:hover td{background:rgba(14,165,233,.04)}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;gap:4px}
.badge-green{background:rgba(16,185,129,.15);color:#34d399}
.badge-amber{background:rgba(245,158,11,.15);color:#fbbf24}
.badge-red{background:rgba(239,68,68,.15);color:#f87171}
.badge-blue{background:rgba(22,163,74,.15);color:var(--teal2)}
.badge-purple{background:rgba(139,92,246,.15);color:#a78bfa}
.badge-gray{background:rgba(100,116,139,.15);color:var(--dim2)}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12px;color:var(--dim2);font-weight:500}
.form-group input,.form-group select,.form-group textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.form-group select option{background:var(--card)}
.form-group textarea{resize:vertical;min-height:80px}
.form-title{font-size:15px;font-weight:600;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}

/* MODAL */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1}
.modal-title{font-size:15px;font-weight:600}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--card);position:sticky;bottom:0}

/* FILTERS */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;font-size:13px;outline:none}
.filters input:focus,.filters select:focus{border-color:var(--teal)}

/* PLANNING */
.planning-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.planning-date{font-size:18px;font-weight:700;font-family:'Syne',sans-serif}
.kanban{display:grid;gap:16px;margin-top:16px}
.kanban-col{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;min-height:200px}
.kanban-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.kanban-col-name{font-weight:600;font-size:13px}
.delivery-card{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:10px;margin-bottom:8px;cursor:pointer;transition:.2s}
.delivery-card:hover{border-color:var(--teal)}
.delivery-card .dc-ref{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal)}
.delivery-card .dc-client{font-weight:600;font-size:13px;margin:3px 0}
.delivery-card .dc-addr{font-size:11px;color:var(--dim2)}
.delivery-card .dc-time{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);margin-top:5px}

/* FINANCE */
.calc-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px}
.calc-result{background:var(--card2);border-radius:8px;padding:16px;margin-top:16px}
.calc-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.calc-row:last-child{border:none;font-weight:700;font-size:15px;color:var(--teal2);margin-top:4px}
.calc-label{color:var(--dim2)}
.calc-val{font-family:'JetBrains Mono',monospace}

/* PROGRESS */
.progress{background:var(--border);border-radius:10px;height:6px;overflow:hidden}
.progress-bar{height:100%;border-radius:10px;transition:.5s}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--card2);padding:4px;border-radius:8px;width:fit-content}
.tab{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;color:var(--dim2);transition:.2s;border:none;background:transparent}
.tab.active{background:var(--teal);color:#fff}

/* MISC */
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.text-sm{font-size:12px}.text-dim{color:var(--dim2)}.text-green{color:var(--green)}.text-red{color:var(--red)}.text-amber{color:var(--amber)}.text-teal{color:var(--teal2)}
.fw6{font-weight:600}.fw7{font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:15px;font-weight:600}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}

/* SCROLL */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}

/* TOAST */
#toast-container{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:10px;animation:slideIn .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.4);min-width:280px}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.toast.info{border-left:3px solid var(--teal)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Driver profile avatar colors */
.av-teal{background:rgba(14,165,233,.2);color:var(--teal2)}
.av-coral{background:rgba(249,115,22,.2);color:#fb923c}
.av-green{background:rgba(16,185,129,.2);color:#34d399}
.av-purple{background:rgba(139,92,246,.2);color:#a78bfa}
.av-amber{background:rgba(245,158,11,.2);color:#fbbf24}

@media(max-width:900px){
  #sidebar{width:60px}
  .nav-item span{display:none}
  .logo-title,.logo-sub,.sidebar-date{display:none}
  #main{margin-left:60px}
  .stat-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

// ===================================================================
// UTILS
// ===================================================================
function xpf(n) {
  return Math.round(n).toLocaleString('fr-FR') + ' XPF';
}
function fmt_date(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function fmt_long(d) {
  if (!d) return '—';
  return new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function genId(prefix) {
  return prefix + Date.now().toString(36).toUpperCase();
}
function getCommission(nb) {
  if (nb >= 150) return COMMISSION_RATES.senior;
  if (nb >= 50) return COMMISSION_RATES.confirme;
  return COMMISSION_RATES.debutant;
}
function avatarColors(i) {
  const cls = ['av-teal','av-coral','av-green','av-purple','av-amber'];
  return cls[i % cls.length];
}
function initiales(p, n) {
  return (p[0] + n[0]).toUpperCase();
}

// ===================================================================
// CALCULS TARIFS
// ===================================================================
function calculerTarif(zone, km, poids, weekend, urgent, fragile) {
  const base = ZONES[zone]?.base || 900;
  let ht = base + (km * PAR_KM);
  if (poids > 5) ht += SUPP_LOURD;
  if (fragile) ht += SUPP_FRAGILE;
  if (weekend) ht = Math.round(ht * (1 + SUPP_WEEKEND));
  if (urgent)  ht = Math.round(ht * (1 + SUPP_URGENT));
  const tgc = Math.round(ht * TGC);
  const ttc = ht + tgc;
  return { ht, tgc, ttc };
}

function calculerPrestation(livreur, prix_ht) {
  const taux = getCommission(livreur?.nb_livraisons || 0).rate;
  const commission = Math.round(prix_ht * taux);
  const marge = prix_ht - commission;
  return { taux, commission, marge };
}

// ===================================================================
// NAVIGATION
// ===================================================================
const PAGE_TITLES = {
  dashboard: 'Tableau de bord',
  reservations: 'Réservations',
  planning: 'Planning journalier',
  livreurs: 'Livreurs',
  recrutement: 'Recrutement',
  finance: 'Finance & Marges'
};

function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  document.getElementById('topbar-title').textContent = PAGE_TITLES[page];
  renderPage(page);
}

function renderPage(page) {
  const fns = {
    dashboard: renderDashboard,
    reservations: renderReservations,
    planning: renderPlanning,
    livreurs: renderLivreurs,
    recrutement: renderRecrutement,
    finance: renderFinance
  };
  fns[page]?.();
}

function assignerLivreur(livId, livreurId) {
  const l = S.livraisons.find(x => x.id === livId);
  if (!l) return;
  l.livreur_id = livreurId;
  if (livreurId && l.statut === 'en_attente') l.statut = 'confirmee';
  save();
  renderPlanning();
  toast('Livreur assigné ✅', 'success');
}

function activerLivreur(id) {
  const lv = S.livreurs.find(x => x.id === id);
  if (!lv) return;
  lv.statut = 'actif';
  lv.date_embauche = today();
  save();
  renderLivreurs();
  toast(`${lv.prenom} ${lv.nom} activé(e) ✅`, 'success');
}

function examinerCandidature(id) {
  const c = S.candidatures.find(x => x.id === id);
  if (!c) return;
  c.statut = 'en_examen';
  save(); renderRecrutement();
  toast('Candidature passée en examen', 'info');
}

function accepterCandidature(id) {
  const c = S.candidatures.find(x => x.id === id);
  if (!c) return;
  c.statut = 'accepte';
  // Créer le livreur automatiquement
  const numLiv = String(S.livreurs.length + 1).padStart(3, '0');
  const newLiv = {
    id: genId('L'), matricule: `LIV-${numLiv}`,
    prenom: c.prenom, nom: c.nom, tel: c.tel, email: c.email,
    adresse: c.adresse || '', vehicule_type: c.vehicule, vehicule_immat: '',
    permis: c.permis, statut: 'en_attente', date_embauche: null,
    nb_livraisons: 0, note_moyenne: 0, rib: '', notes: `Issu candidature ${c.ref}`
  };
  S.livreurs.push(newLiv);
  save(); renderRecrutement();
  toast(`${c.prenom} ${c.nom} accepté(e) → Livreur créé (${newLiv.matricule})`, 'success');
}

function refuserCandidature(id) {
  const c = S.candidatures.find(x => x.id === id);
  if (!c) return;
  c.statut = 'refuse';
  save(); renderRecrutement();
  toast('Candidature refusée', 'error');
}

function deleteCandidature(id) {
  if (!confirm('Supprimer cette candidature ?')) return;
  S.candidatures = S.candidatures.filter(x => x.id !== id);
  save(); renderRecrutement();
  toast('Candidature supprimée', 'info');
}

function soumettreInscription(e) {
  e.preventDefault();
  const num = String(S.candidatures.length + 1).padStart(3, '0');
  S.candidatures.push({
    id: genId('C'), ref: `CAND-${num}`,
    prenom: document.getElementById('ins_prenom').value,
    nom: document.getElementById('ins_nom').value,
    tel: document.getElementById('ins_tel').value,
    email: document.getElementById('ins_email').value,
    adresse: document.getElementById('ins_adresse').value,
    vehicule: document.getElementById('ins_vehicule').value,
    permis: document.getElementById('ins_permis').value,
    experience: document.getElementById('ins_experience').value,
    date: today(), statut: 'nouveau', notes_rh: ''
  });
  save(); renderRecrutement();
  toast('Candidature envoyée ! Elle sera examinée sous 48h 🎉', 'success');
  e.target.reset();
}

let finPeriode = 'mois';
let calcZone = 'papeete', calcKm = 5, calcPoids = 2, calcWeekend = false, calcUrgent = false, calcFragile = false;

function renderFinance() {
  const t = today();
  const mois = t.substring(0, 7);

  let data = S.livraisons.filter(l => l.statut !== 'annulee');
  if (finPeriode === 'jour') data = data.filter(l => l.date === t);
  else if (finPeriode === 'semaine') {
    const d = new Date(); const lundi = new Date(d.setDate(d.getDate() - d.getDay() + 1));
    data = data.filter(l => l.date >= lundi.toISOString().split('T')[0] && l.date <= t);
  } else data = data.filter(l => l.date.startsWith(mois));

  const totalHT = data.reduce((a, l) => a + l.prix_ht, 0);
  const totalComm = data.reduce((a, l) => {
    const lv = S.livreurs.find(x => x.id === l.livreur_id);
    return a + calculerPrestation(lv, l.prix_ht).commission;
  }, 0);
  const totalMarge = totalHT - totalComm;
  const tgcTotal = Math.round(totalHT * TGC);

  // Calcul temps réel
  const tarif = calculerTarif(calcZone, calcKm, calcPoids, calcWeekend, calcUrgent, calcFragile);

  let html = `
  <div class="grid-2 mb-6">
    <div class="card">
      <div class="section-header mb-4">
        <div class="section-title">💹 Résumé financier</div>
        <div class="tabs" style="margin-bottom:0">
          ${['jour','semaine','mois'].map(p => `<button class="tab ${finPeriode===p?'active':''}" onclick="finPeriode='${p}';renderFinance()">${p.charAt(0).toUpperCase()+p.slice(1)}</button>`).join('')}
        </div>
      </div>
      <div class="calc-result" style="margin-top:0">
        <div class="calc-row"><span class="calc-label">Livraisons (${data.length})</span><span class="calc-val">${data.length}</span></div>
        <div class="calc-row"><span class="calc-label">Chiffre d'affaires HT</span><span class="calc-val text-teal">${xpf(totalHT)}</span></div>
        <div class="calc-row"><span class="calc-label">TGC 16%</span><span class="calc-val">${xpf(tgcTotal)}</span></div>
        <div class="calc-row"><span class="calc-label">CA TTC</span><span class="calc-val">${xpf(totalHT + tgcTotal)}</span></div>
        <div class="calc-row"><span class="calc-label">Commissions livreurs</span><span class="calc-val text-red">- ${xpf(totalComm)}</span></div>
        <div class="calc-row"><span class="calc-label">MARGE SOCIÉTÉ</span><span class="calc-val text-green">${xpf(totalMarge)}</span></div>
        <div class="calc-row" style="padding-top:8px;border-top:1px solid var(--border)">
          <span class="calc-label">Taux marge</span>
          <span class="calc-val" style="color:var(--amber)">${totalHT > 0 ? Math.round(totalMarge/totalHT*100) : 0}%</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title mb-4">🧮 Simulateur de tarif</div>
      <div class="form-grid mb-4">
        <div class="form-group">
          <label>Zone de livraison</label>
          <select onchange="calcZone=this.value;renderFinance()">
            ${Object.entries(ZONES).map(([k,z]) => `<option value="${k}" ${calcZone===k?'selected':''}>${z.label}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Distance (km)</label>
          <input type="number" min="0" max="100" value="${calcKm}" onchange="calcKm=+this.value;renderFinance()">
        </div>
        <div class="form-group">
          <label>Poids (kg)</label>
          <input type="number" min="0" max="500" step="0.5" value="${calcPoids}" onchange="calcPoids=+this.value;renderFinance()">
        </div>
      </div>
      <div class="flex gap-3 mb-4" style="flex-wrap:wrap;font-size:13px">
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer">
          <input type="checkbox" ${calcWeekend?'checked':''} onchange="calcWeekend=this.checked;renderFinance()"> Weekend (+20%)
        </label>
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer">
          <input type="checkbox" ${calcUrgent?'checked':''} onchange="calcUrgent=this.checked;renderFinance()"> Urgent (+30%)
        </label>
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer">
          <input type="checkbox" ${calcFragile?'checked':''} onchange="calcFragile=this.checked;renderFinance()"> Fragile (+300 XPF)
        </label>
      </div>
      <div class="calc-result">
        <div class="calc-row"><span class="calc-label">Base zone</span><span class="calc-val">${xpf(ZONES[calcZone].base)}</span></div>
        <div class="calc-row"><span class="calc-label">Kilométrage (${calcKm} km × ${PAR_KM} XPF)</span><span class="calc-val">${xpf(calcKm * PAR_KM)}</span></div>
        ${calcPoids > 5 ? `<div class="calc-row"><span class="calc-label">Supplément lourd (&gt;5kg)</span><span class="calc-val">${xpf(SUPP_LOURD)}</span></div>` : ''}
        ${calcFragile ? `<div class="calc-row"><span class="calc-label">Supplément fragile</span><span class="calc-val">${xpf(SUPP_FRAGILE)}</span></div>` : ''}
        ${calcWeekend ? `<div class="calc-row"><span class="calc-label">Majoration weekend +20%</span><span class="calc-val">+</span></div>` : ''}
        ${calcUrgent ? `<div class="calc-row"><span class="calc-label">Majoration urgent +30%</span><span class="calc-val">+</span></div>` : ''}
        <div class="calc-row"><span class="calc-label">Prix HT</span><span class="calc-val text-teal">${xpf(tarif.ht)}</span></div>
        <div class="calc-row"><span class="calc-label">TGC 16%</span><span class="calc-val">${xpf(tarif.tgc)}</span></div>
        <div class="calc-row"><span>PRIX CLIENT TTC</span><span class="calc-val">${xpf(tarif.ttc)}</span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title mb-4">🛵 Prestations par livreur (${finPeriode})</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Livreur</th><th>Livraisons</th><th>CA HT généré</th><th>Taux commission</th><th>Commission livreur</th><th>Marge société</th><th>% marge</th></tr></thead>
        <tbody>
          ${S.livreurs.filter(l => l.statut === 'actif').map((lv, i) => {
            const mes = data.filter(l => l.livreur_id === lv.id);
            const ca = mes.reduce((a, l) => a + l.prix_ht, 0);
            const cr = getCommission(lv.nb_livraisons);
            const comm = Math.round(ca * cr.rate);
            const marge = ca - comm;
            return `<tr>
              <td>
                <div class="flex items-center gap-2">
                  <div class="avatar ${avatarColors(i)}">${initiales(lv.prenom, lv.nom)}</div>
                  <div>
                    <div class="fw6">${lv.prenom} ${lv.nom}</div>
                    <div class="text-dim text-sm">${cr.label}</div>
                  </div>
                </div>
              </td>
              <td class="mono fw6">${mes.length}</td>
              <td class="mono text-teal">${xpf(ca)}</td>
              <td><span class="badge badge-blue">${Math.round(cr.rate*100)}%</span></td>
              <td class="mono text-green">${xpf(comm)}</td>
              <td class="mono text-amber">${xpf(marge)}</td>
              <td class="mono">${ca > 0 ? Math.round(marge/ca*100) : 0}%</td>
            </tr>`;
          }).join('')}
          <tr style="background:var(--card2)">
            <td class="fw7">TOTAL</td>
            <td class="mono fw7">${data.length}</td>
            <td class="mono fw7 text-teal">${xpf(totalHT)}</td>
            <td>—</td>
            <td class="mono fw7 text-green">${xpf(totalComm)}</td>
            <td class="mono fw7 text-amber">${xpf(totalMarge)}</td>
            <td class="mono fw7">${totalHT > 0 ? Math.round(totalMarge/totalHT*100) : 0}%</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>`;

  document.getElementById('page-finance').innerHTML = html;
}

function sauvegarderReservation(id) {
  const zone = document.getElementById('r_zone').value;
  const km = +(document.getElementById('r_km').value);
  const poids = +(document.getElementById('r_poids').value);
  const weekend = document.getElementById('r_weekend').checked;
  const urgent = document.getElementById('r_urgent').checked;
  const fragile = document.getElementById('r_fragile').checked;
  const tarif = calculerTarif(zone, km, poids, weekend, urgent, fragile);

  if (id) {
    const l = S.livraisons.find(x => x.id === id);
    if (!l) return;
    Object.assign(l, {
      client_nom: document.getElementById('r_client_nom').value,
      client_tel: document.getElementById('r_client_tel').value,
      client_email: document.getElementById('r_client_email').value,
      adresse_collecte: document.getElementById('r_collecte').value,
      adresse_livraison: document.getElementById('r_livraison').value,
      zone, km, poids_kg: poids, weekend, urgent, fragile,
      date: document.getElementById('r_date').value,
      heure: document.getElementById('r_heure').value,
      livreur_id: document.getElementById('r_livreur').value,
      statut: document.getElementById('r_statut')?.value || l.statut,
      prix_ht: tarif.ht, notes: document.getElementById('r_notes').value
    });
    toast('Réservation mise à jour ✅', 'success');
  } else {
    const num = String(S.livraisons.length + 1).padStart(3, '0');
    const livreurId = document.getElementById('r_livreur').value;
    S.livraisons.push({
      id: genId('LV'), ref: `FL-2026-${num}`,
      client_nom: document.getElementById('r_client_nom').value,
      client_tel: document.getElementById('r_client_tel').value,
      client_email: document.getElementById('r_client_email').value,
      adresse_collecte: document.getElementById('r_collecte').value,
      adresse_livraison: document.getElementById('r_livraison').value,
      zone, km, poids_kg: poids, weekend, urgent, fragile,
      date: document.getElementById('r_date').value,
      heure: document.getElementById('r_heure').value,
      livreur_id: livreurId,
      statut: livreurId ? 'confirmee' : 'en_attente',
      prix_ht: tarif.ht, notes: document.getElementById('r_notes').value,
      date_creation: today()
    });
    toast('Réservation créée ✅', 'success');
  }
  save(); closeModal(); renderPage(getCurrentPage());
}

function changerStatut(id) {
  const l = S.livraisons.find(x => x.id === id);
  if (!l) return;
  const ordre = ['en_attente','confirmee','en_cours','livree'];
  const idx = ordre.indexOf(l.statut);
  if (idx < ordre.length - 1) {
    l.statut = ordre[idx + 1];
    if (l.statut === 'livree') {
      const lv = S.livreurs.find(x => x.id === l.livreur_id);
      if (lv) lv.nb_livraisons++;
    }
    save(); renderPage(getCurrentPage());
    toast(`Statut → ${STATUTS_LIV[l.statut].label}`, 'info');
  }
}

function deleteLivraison(id) {
  if (!confirm('Supprimer cette réservation ?')) return;
  S.livraisons = S.livraisons.filter(x => x.id !== id);
  save(); renderPage(getCurrentPage());
  toast('Réservation supprimée', 'info');
}

  document.getElementById('modal-body').innerHTML = `
  <div class="form-grid">

    <div class="form-group"><label>Nom *</label><input id="lv_nom" value="${lv?.nom||''}" required></div>
    <div class="form-group"><label>Téléphone *</label><input id="lv_tel" value="${lv?.tel||''}"></div>
    <div class="form-group"><label>Email</label><input id="lv_email" type="email" value="${lv?.email||''}"></div>
    <div class="form-group"><label>Adresse</label><input id="lv_adresse" value="${lv?.adresse||''}"></div>
    <div class="form-group"><label>Véhicule</label>
      <select id="lv_vehicule">
        ${Object.entries(VEHICULES).map(([k,v]) => `<option value="${k}" ${lv?.vehicule_type===k?'selected':''}>${v}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Immatriculation</label><input id="lv_immat" value="${lv?.vehicule_immat||''}" placeholder="PF-XXX-X"></div>
    <div class="form-group"><label>Permis</label>
      <select id="lv_permis">
        <option value="A" ${lv?.permis==='A'?'selected':''}>A (moto)</option>
        <option value="B" ${lv?.permis==='B'?'selected':''}>B (voiture)</option>
        <option value="C" ${lv?.permis==='C'?'selected':''}>C (camion)</option>
      </select>
    </div>
    <div class="form-group"><label>Statut</label>
      <select id="lv_statut">
        <option value="en_attente" ${lv?.statut==='en_attente'?'selected':''}>En attente</option>
        <option value="actif" ${lv?.statut==='actif'?'selected':''}>Actif</option>
        <option value="inactif" ${lv?.statut==='inactif'?'selected':''}>Inactif</option>
        <option value="suspendu" ${lv?.statut==='suspendu'?'selected':''}>Suspendu</option>
      </select>
    </div>
    <div class="form-group"><label>RIB / IBAN local</label><input id="lv_rib" value="${lv?.rib||''}"></div>
  </div>
  <div class="form-group mt-4"><label>Notes internes</label><textarea id="lv_notes">${lv?.notes||''}</textarea></div>`;

  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" onclick="sauvegarderLivreur('${id||''}')">💾 Enregistrer</button>`;
  document.getElementById('overlay').classList.add('open');
}

function sauvegarderLivreur(id) {
  if (id) {
    const lv = S.livreurs.find(x => x.id === id);
    if (!lv) return;
    Object.assign(lv, {
      prenom: document.getElementById('lv_prenom').value,
      nom: document.getElementById('lv_nom').value,
      tel: document.getElementById('lv_tel').value,
      email: document.getElementById('lv_email').value,
      adresse: document.getElementById('lv_adresse').value,
      vehicule_type: document.getElementById('lv_vehicule').value,
      vehicule_immat: document.getElementById('lv_immat').value,
      permis: document.getElementById('lv_permis').value,
      statut: document.getElementById('lv_statut').value,
      rib: document.getElementById('lv_rib').value,
      notes: document.getElementById('lv_notes').value
    });
    if (lv.statut === 'actif' && !lv.date_embauche) lv.date_embauche = today();
    toast('Livreur mis à jour ✅', 'success');
  } else {
    const num = String(S.livreurs.length + 1).padStart(3, '0');
    S.livreurs.push({
      id: genId('L'), matricule: `LIV-${num}`,
      prenom: document.getElementById('lv_prenom').value,
      nom: document.getElementById('lv_nom').value,
      tel: document.getElementById('lv_tel').value,
      email: document.getElementById('lv_email').value,
      adresse: document.getElementById('lv_adresse').value,
      vehicule_type: document.getElementById('lv_vehicule').value,
      vehicule_immat: document.getElementById('lv_immat').value,
      permis: document.getElementById('lv_permis').value,
      statut: document.getElementById('lv_statut').value,
      date_embauche: document.getElementById('lv_statut').value === 'actif' ? today() : null,
      nb_livraisons: 0, note_moyenne: 0,
      rib: document.getElementById('lv_rib').value,
      notes: document.getElementById('lv_notes').value
    });
    toast('Livreur créé ✅', 'success');
  }
  save(); closeModal(); renderPage(getCurrentPage());
}

function deleteLivreur(id) {
  if (!confirm('Supprimer ce livreur ?')) return;
  S.livreurs = S.livreurs.filter(x => x.id !== id);
  save(); renderPage(getCurrentPage());
  toast('Livreur supprimé', 'info');
}

// ===================================================================
// MODAL / TOAST UTILS
// ===================================================================
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

function toast(msg, type = 'info') {
  const tc = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type==='success'?'✅':type==='error'?'❌':'ℹ️'}</span><span>${msg}</span>`;
  tc.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function getCurrentPage() {
  const active = document.querySelector('.page.active');
  return active?.id.replace('page-', '') || 'dashboard';
}

// ===================================================================
// INIT
// ===================================================================
function init() {
  load();

  // Navigation
  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => navigate(el.dataset.page));
  });

  // Date sidebar
  const now = new Date();
  document.getElementById('sidebar-date').textContent = now.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' });

  // Render initial page
  renderDashboard();
}

init();
</script>
